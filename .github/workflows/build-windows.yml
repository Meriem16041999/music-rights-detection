name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create tools directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force tools

      - name: Download FFmpeg
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "ffmpeg.zip"

          Expand-Archive `
            -Path "ffmpeg.zip" `
            -DestinationPath "ffmpeg-temp"

          $ffmpeg = Get-ChildItem `
            -Path "ffmpeg-temp" `
            -Recurse `
            -Filter "ffmpeg.exe" |
            Select-Object -First 1

          $ffprobe = Get-ChildItem `
            -Path "ffmpeg-temp" `
            -Recurse `
            -Filter "ffprobe.exe" |
            Select-Object -First 1

          Copy-Item `
            $ffmpeg.FullName `
            "tools/ffmpeg.exe"

          Copy-Item `
            $ffprobe.FullName `
            "tools/ffprobe.exe"

      - name: Verify tools
        shell: powershell
        run: |
          Get-ChildItem tools

      - name: Build Python backend
        run: |
          pyinstaller music-rights-backend.spec

      - name: Verify backend
        shell: powershell
        run: |
          Get-ChildItem `
            -Recurse `
            dist/music-rights-backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Windows desktop app
        working-directory: frontend
        run: npm run desktop:build:win

      - name: Find generated EXE
        shell: powershell
        run: |
          Get-ChildItem `
            -Path frontend `
            -Recurse `
            -Filter "*.exe"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Music-Rights-Windows
          path: |
            frontend/dist/*.exe
            frontend/release/*.exe
          if-no-files-found: warn