name: Build Music Rights Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dependances Python
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Installer et preparer FFmpeg
        shell: powershell
        run: |
          choco install ffmpeg -y

          New-Item -ItemType Directory -Force -Path "windows-tools"

          $ffmpegReal = Get-ChildItem `
            "C:\ProgramData\chocolatey\lib\ffmpeg" `
            -Recurse `
            -Filter "ffmpeg.exe" |
            Where-Object {
              $_.FullName -like "*\bin\ffmpeg.exe"
            } |
            Select-Object -First 1

          $ffprobeReal = Get-ChildItem `
            "C:\ProgramData\chocolatey\lib\ffmpeg" `
            -Recurse `
            -Filter "ffprobe.exe" |
            Where-Object {
              $_.FullName -like "*\bin\ffprobe.exe"
            } |
            Select-Object -First 1

          if (-not $ffmpegReal) {
            throw "Vrai ffmpeg.exe introuvable"
          }

          if (-not $ffprobeReal) {
            throw "Vrai ffprobe.exe introuvable"
          }

          Write-Host "FFMPEG REEL = $($ffmpegReal.FullName)"
          Write-Host "FFPROBE REEL = $($ffprobeReal.FullName)"

          Copy-Item `
            $ffmpegReal.FullName `
            "windows-tools\ffmpeg.exe"

          Copy-Item `
            $ffprobeReal.FullName `
            "windows-tools\ffprobe.exe"

          Write-Host "=== TEST FFMPEG ==="
          & "windows-tools\ffmpeg.exe" -version

          Write-Host "=== TEST FFPROBE ==="
          & "windows-tools\ffprobe.exe" -version

          Write-Host "=== CONTENU WINDOWS-TOOLS ==="
          Get-ChildItem "windows-tools"

      - name: Construire le backend Windows
        shell: powershell
        run: |
          python -c "import fastapi; print('FASTAPI AVANT PYINSTALLER:', fastapi.__file__)"

          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onedir `
            --name music-rights-backend `
            --add-binary "windows-tools\ffmpeg.exe;tools" `
            --add-binary "windows-tools\ffprobe.exe;tools" `
            --collect-all fastapi `
            --collect-all starlette `
            --collect-all pydantic `
            --collect-all pydantic_core `
            --collect-all librosa `
            --collect-all soundfile `
            --collect-all numba `
            --collect-all demucs `
            --hidden-import fastapi `
            --hidden-import fastapi.applications `
            --hidden-import fastapi.routing `
            --hidden-import fastapi.middleware `
            --hidden-import fastapi.middleware.cors `
            --hidden-import uvicorn `
            backend_api.py

          Write-Host "=== VERIFICATION FFMPEG ==="

          if (-not (Test-Path "dist\music-rights-backend\_internal\tools\ffmpeg.exe")) {
            throw "ffmpeg.exe absent du build"
          }

          if (-not (Test-Path "dist\music-rights-backend\_internal\tools\ffprobe.exe")) {
            throw "ffprobe.exe absent du build"
          }

          Write-Host "FFmpeg et FFprobe sont bien embarques."

          Write-Host "=== VERIFICATION FASTAPI ==="

          Get-ChildItem `
            "dist\music-rights-backend" `
            -Recurse `
            -Filter "fastapi*" |
            Select-Object FullName

          if (-not (
            Test-Path "dist\music-rights-backend\_internal\fastapi"
          )) {
            throw "FastAPI absent du build PyInstaller"
          }

          Write-Host "FastAPI est bien embarque."

      - name: Installer les dependances frontend
        working-directory: frontend
        run: npm ci

      - name: Construire l'installateur Windows
        working-directory: frontend
        run: npm run desktop:build:win

      - name: Sauvegarder l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: Music-Rights-Windows
          path: frontend/dist/*.exe
          if-no-files-found: error